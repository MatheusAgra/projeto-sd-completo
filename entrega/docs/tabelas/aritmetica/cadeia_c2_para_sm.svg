<svg xmlns="http://www.w3.org/2000/svg" width="718" height="240" viewBox="0 0 718 240"><rect width="100%" height="100%" fill="white"/><text x="24" y="32" font-family="Arial,sans-serif" font-size="20" font-weight="bold">Valor absoluto e seleção C2 para SM</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#183b66"/></marker></defs><rect x="38" y="48" width="150" height="38" rx="5" fill="#eaf2ff" stroke="#24364b"/><text x="113" y="72" text-anchor="middle" font-family="Arial" font-size="14">N[i]=NOT R[i]</text><text x="223" y="72" font-family="Arial" font-size="14">Cin₀=1; B_FA=0</text><rect x="38" y="100" width="92" height="70" rx="6" fill="#f4f7fb" stroke="#263445"/><text x="84.0" y="128" text-anchor="middle" font-family="Arial" font-size="15">FA bit 0</text><text x="84.0" y="151" text-anchor="middle" font-family="Arial" font-size="12">A,B,Cin → S,Cout</text><path d="M130 135 H148" stroke="#183b66" stroke-width="2" marker-end="url(#arrow)"/><text x="139.0" y="125" text-anchor="middle" font-family="Arial" font-size="10">C1</text><rect x="148" y="100" width="92" height="70" rx="6" fill="#f4f7fb" stroke="#263445"/><text x="194.0" y="128" text-anchor="middle" font-family="Arial" font-size="15">FA bit 1</text><text x="194.0" y="151" text-anchor="middle" font-family="Arial" font-size="12">A,B,Cin → S,Cout</text><path d="M240 135 H258" stroke="#183b66" stroke-width="2" marker-end="url(#arrow)"/><text x="249.0" y="125" text-anchor="middle" font-family="Arial" font-size="10">C2</text><rect x="258" y="100" width="92" height="70" rx="6" fill="#f4f7fb" stroke="#263445"/><text x="304.0" y="128" text-anchor="middle" font-family="Arial" font-size="15">FA bit 2</text><text x="304.0" y="151" text-anchor="middle" font-family="Arial" font-size="12">A,B,Cin → S,Cout</text><path d="M350 135 H368" stroke="#183b66" stroke-width="2" marker-end="url(#arrow)"/><text x="359.0" y="125" text-anchor="middle" font-family="Arial" font-size="10">C3</text><rect x="368" y="100" width="92" height="70" rx="6" fill="#f4f7fb" stroke="#263445"/><text x="414.0" y="128" text-anchor="middle" font-family="Arial" font-size="15">FA bit 3</text><text x="414.0" y="151" text-anchor="middle" font-family="Arial" font-size="12">A,B,Cin → S,Cout</text><path d="M460 135 H478" stroke="#183b66" stroke-width="2" marker-end="url(#arrow)"/><text x="469.0" y="125" text-anchor="middle" font-family="Arial" font-size="10">C4</text><rect x="478" y="100" width="92" height="70" rx="6" fill="#f4f7fb" stroke="#263445"/><text x="524.0" y="128" text-anchor="middle" font-family="Arial" font-size="15">FA bit 4</text><text x="524.0" y="151" text-anchor="middle" font-family="Arial" font-size="12">A,B,Cin → S,Cout</text><path d="M570 135 H588" stroke="#183b66" stroke-width="2" marker-end="url(#arrow)"/><text x="579.0" y="125" text-anchor="middle" font-family="Arial" font-size="10">C5</text><rect x="588" y="100" width="92" height="70" rx="6" fill="#f4f7fb" stroke="#263445"/><text x="634.0" y="128" text-anchor="middle" font-family="Arial" font-size="15">FA bit 5</text><text x="634.0" y="151" text-anchor="middle" font-family="Arial" font-size="12">A,B,Cin → S,Cout</text><text x="38" y="215" font-family="Arial" font-size="14">ABS=~R+1; C2→SM seleciona R ou ABS e descarta ABS[5].</text><text x="38" y="240" font-family="Arial" font-size="13">A propagação é do bit menos significativo (i=0) ao mais significativo (i=5).</text></svg>